version: 2

seeds:
  - name: borough_variants
    description: >
      Canonical NYC borough spelling map, the one definition every layer uses.
      Loaded as a dbt seed by both the Snowflake and DuckDB projects, and read
      as a CSV by local/silver_transformations.py. A newly observed spelling is
      a one-line edit here.
    columns:
      - name: variant
        description: >
          Upper-cased, trimmed borough string as it appears in the source.
          Lookups must apply upper(trim(...)) before matching.
        tests:
          - unique      # a duplicate variant would fan out the int_service_requests_cleaned join
          - not_null
      - name: canonical
        description: "The standardized borough name this variant collapses to."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BROOKLYN', 'MANHATTAN', 'QUEENS', 'BRONX', 'STATEN ISLAND', 'UNSPECIFIED']
