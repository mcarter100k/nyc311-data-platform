version: 2

models:

  - name: fct_data_quality
    description: >
      Data quality fact table, one row per (run_date, check_name). Adds 7-day
      rolling averages, first/last failure dates and a threshold-breach flag to
      SILVER.data_quality_log, for a monitoring dashboard. Rebuilt in full each
      run: the log is small and the rolling window needs all of it.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - run_date
              - check_name
    columns:
      - name: run_date
        description: "UTC date of the pipeline run (YYYY-MM-DD string)."
        tests:
          - not_null
      - name: check_name
        description: "Quality check identifier (null_rate_unique_key, duplicate_rate, etc.)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - null_rate_unique_key
                  - null_rate_created_date
                  - duplicate_rate
                  - invalid_resolution_days
                  - unrecognized_borough
      - name: pipeline_stage
        description: "Always 'silver' for checks written by the Silver transform."
        tests:
          - not_null
      - name: records_checked
        description: "Records in scope for this check on this run_date."
        tests:
          - not_null
      - name: records_failed
        description: "Records that failed this check on this run_date."
        tests:
          - not_null
      - name: failure_rate
        description: "records_failed / records_checked rounded to 6 decimal places."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
      - name: rolling_7d_avg_failure_rate
        description: >
          Average failure_rate over the 7-calendar-day window ending on
          run_date (self-join on dates, not a row-count frame — outage gaps
          shrink the sample instead of stretching the window).
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
      - name: rolling_7d_day_count
        description: "Number of run_dates with data inside the 7-calendar-day window (max 7; fewer in the first week and after outages)."
        tests:
          - not_null
      - name: first_seen
        description: "Earliest run_date on which this check had at least one failure. NULL if no failures ever."
      - name: last_seen
        description: "Most recent run_date on which this check had at least one failure. NULL if no failures ever."
      - name: total_days_with_failures
        description: "Total run_dates across all history where records_failed > 0."
        tests:
          - not_null
      - name: is_rolling_threshold_breached
        description: "TRUE when the 7-day rolling average exceeds this model's per-check threshold (5% null keys/dates, 10% duplicates, 1% invalid resolution days, 5% unrecognized borough)."
        tests:
          - not_null
