version: 2

models:

  # ── dim_agency ──────────────────────────────────────────────────────────────

  - name: dim_agency
    description: >
      Agency dimension. SCD Type 2 — one row per version of each agency record.
      A new version is opened whenever agency_name changes for a given
      agency_abbreviation. Abbreviation changes are not versioned; a new
      abbreviation is treated as a new agency. Multiple rows per agency are
      normal (one current, zero or more expired). Populated from agency_snapshot,
      which runs the dbt check strategy on agency_name. See ADR 007.
    columns:
      - name: agency_key
        description: >
          MD5 surrogate key on (agency_abbreviation, dbt_valid_from timestamp).
          Unique per version — the full timestamp (not effective_date) keeps
          same-day versions distinct. Old agency_key values are retained when a
          new version opens, so historical fact rows continue to resolve their FK.
        tests:
          - unique
          - not_null
      - name: agency_abbreviation
        description: >
          Short code identifying the agency (e.g. NYPD, DOT, DSNY). Natural key —
          stable across name-change versions. Not unique in this table because
          multiple versions of the same agency coexist.
        tests:
          - not_null
      - name: agency_name
        description: "Full agency name, initcap-normalized. The tracked changing attribute."
        tests:
          - not_null
      - name: effective_date
        description: "Date this version of the agency record became active."
        tests:
          - not_null
      - name: expiry_date
        description: >
          Date this version was superseded by a newer name. NULL for the current
          version. Cast from dbt_valid_to (snapshot timestamp) to DATE.
      - name: valid_from
        description: >
          Join-window start for the point-in-time join in fct_service_requests.
          Equals effective_date except for each agency's first version, which is
          backdated to 1900-01-01 so requests created before the first snapshot
          run still resolve to a version. Windows are half-open:
          [valid_from, expiry_date).
        tests:
          - not_null
      - name: is_current
        description: >
          TRUE for exactly one row per agency_abbreviation — the version with
          NULL expiry_date. The singular test assert_one_current_agency_per_
          abbreviation.sql enforces this constraint.
        tests:
          - not_null

  # ── dim_date ────────────────────────────────────────────────────────────────

  - name: dim_date
    description: >
      Calendar date dimension spanning 2010-01-01 through 2030-12-31 (controlled
      by project variables min_date / max_date). One row per calendar day.
      Contains calendar hierarchy attributes, weekend flag, and US federal
      holiday flag. No dependency on service request data — populated entirely
      from the generate_date_spine macro.
    columns:
      - name: date_id
        description: "Integer surrogate key in YYYYMMDD format. Sortable and human-readable."
        tests:
          - unique
          - not_null
      - name: full_date
        description: "Calendar date (DATE type). Join target for fct_service_requests.created_date_id."
        tests:
          - unique
          - not_null
      - name: year
        description: "4-digit calendar year."
        tests:
          - not_null
      - name: quarter
        description: "Calendar quarter (1–4)."
        tests:
          - not_null
      - name: month
        description: "Month number (1–12)."
        tests:
          - not_null
      - name: month_name
        description: "Full month name (e.g. January)."
        tests:
          - not_null
      - name: day_of_week
        description: >
          ISO day of week: 1=Monday … 7=Sunday. Immune to the Snowflake
          WEEK_START session/account parameter.
        tests:
          - not_null
      - name: is_weekend
        description: "TRUE for Saturday (6) and Sunday (7, ISO numbering). Used in volume trend analysis."
        tests:
          - not_null
      - name: is_federal_holiday
        description: "TRUE for the 11 US federal holidays. See model SQL for rule logic."
        tests:
          - not_null

  # ── dim_location ────────────────────────────────────────────────────────────

  - name: dim_location
    description: >
      Location dimension. One row per unique (borough, community_board, incident_zip)
      combination EVER observed in the service request dataset. Borough values are the
      standardized forms from int_service_requests_cleaned (five canonical names
      plus UNSPECIFIED). Null community boards and ZIP codes are coalesced to 'UNKNOWN'.

      Append-only (incremental). Members are never dropped when their rows
      leave Silver's rolling window, because fct_service_requests keeps them
      longer. Members never change: the three attributes are the key, so a
      change yields a new member.
    columns:
      - name: location_id
        description: "MD5 surrogate key on (borough, community_board, incident_zip)."
        tests:
          - unique
          - not_null
      - name: borough
        description: "Standardized borough name (BROOKLYN, MANHATTAN, QUEENS, BRONX, STATEN ISLAND, UNSPECIFIED)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BROOKLYN', 'MANHATTAN', 'QUEENS', 'BRONX', 'STATEN ISLAND', 'UNSPECIFIED']
      - name: community_board
        description: "Community board designation or 'UNKNOWN' when absent."
        tests:
          - not_null
      - name: incident_zip
        description: "5-digit ZIP code or 'UNKNOWN' when absent."
        tests:
          - not_null

  # ── fct_service_requests ────────────────────────────────────────────────────

  - name: fct_service_requests
    description: >
      Atomic fact table. One row per NYC 311 service request. Grain: unique_key.
      Clustered on cast(created_date as date) for time-range query performance
      in Snowflake. Foreign keys to dim_agency, dim_date, and dim_location. All
      dimension joins are LEFT joins to avoid losing records with null location
      or unrecognized agency. The dim_agency join is point-in-time on the SCD2
      validity window, so rebuilds are idempotent.
    columns:
      - name: service_request_id
        description: "MD5 surrogate key on unique_key."
        tests:
          - unique
          - not_null

      - name: unique_key
        description: "Natural key from NYC Open Data."
        tests:
          - unique
          - not_null

      - name: agency_id
        description: >
          Foreign key to dim_agency.agency_key, assigned point-in-time: the
          version whose [valid_from, expiry_date) window contains the request's
          created_date, so historical rows may point to expired versions. NULL
          when the LEFT join misses, hence no not_null test. The FK stays valid
          because dim_agency comes from a snapshot, which never deletes a
          version.
        tests:
          - relationships:
              arguments:
                to: ref('dim_agency')
                field: agency_key

      - name: created_date_id
        description: "Foreign key to dim_date (YYYYMMDD integer)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id

      - name: location_id
        description: >
          Foreign key to dim_location. dim_location only ever grows, so this FK
          stays valid after a location leaves Silver's rolling window.
        tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_id

      - name: complaint_type
        description: "Raw complaint type (degenerate dimension — too high-cardinality for a standalone dim)."
        tests:
          - not_null

      - name: complaint_category
        description: "Grouped complaint category from the intermediate classification CASE WHEN."
        tests:
          - not_null

      - name: latitude
        description: "WGS84 latitude of the incident. NULL where the address was not geocodable."

      - name: longitude
        description: "WGS84 longitude of the incident. NULL wherever latitude is NULL."

      - name: resolution_days
        description: "Calendar days (midnights crossed) between created_date and closed_date. NULL for open requests."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "resolution_days is not null"

      - name: is_resolved
        description: "TRUE when status = 'Closed'."
        tests:
          - not_null

      - name: is_overdue
        description: "TRUE when resolution_days > closure_window_days (30). NULL until status is Closed."

      - name: closure_type
        description: >
          How the request was closed (see int_service_requests_cleaned): status
          says the ticket is finished, closure_type says what finished it.
          'Unspecified' means the source stated no resolution; 'Undecodable'
          means it stated one that no rule matched.
        tests:
          - not_null

      - name: is_actioned
        description: >
          TRUE when closure_type is Resolved on Scene, Enforcement Action or
          Work Performed — i.e. the city did something. A request can be
          is_resolved = TRUE and is_actioned = FALSE; that is the majority case.

          FALSE is not proof of inaction: closure_type = 'Undecodable' also
          lands here, including some text that describes work. Read any action
          rate beside fct_daily_volume.undecodable_closure_requests.
        tests:
          - not_null

      - name: _loaded_at
        description: >
          Silver run timestamp (_silver_timestamp). Incremental watermark for
          this table.
        tests:
          - not_null

      - name: schema_version
        description: >
          Schema contract version this row was last merged under. Durable here,
          not in the staging view: after a var bump, rows no later merge
          touches keep the version that built them. A --full-refresh restamps
          all history with the current version. See ADR 006.
        tests:
          - not_null

  # ── fct_daily_volume ────────────────────────────────────────────────────────

  - name: fct_daily_volume
    description: >
      Pre-aggregated daily volume fact. Grain: one row per (full_date, borough,
      complaint_category), derived from fct_service_requests for time-series
      dashboards and borough-level reporting.

      Every rate is windowed and gated. A rate of "closed" over "created on
      this day" reads low on recent days, because those requests have not had
      time to close. Each rate counts closures within closure_window_days of
      creation and is published only where is_denominator_closed; the
      assert_daily_volume_rates_have_closed_denominators test checks both
      directions (no rate published early, no eligible day suppressed). The
      daily fetch re-pulls 37 days of requests, so closures up to day 30 are
      seen after the source settles (ADR 016).
    columns:
      - name: daily_volume_id
        description: "MD5 surrogate key on (full_date, borough, complaint_category)."
        tests:
          - unique
          - not_null

      - name: full_date
        description: "Calendar date of the service requests being counted."
        tests:
          - not_null

      - name: borough
        description: >
          Standardized borough name. Fact rows with no location_id are folded
          into UNSPECIFIED by the model (coalesce), so this is never NULL.
        tests:
          - not_null

      - name: complaint_category
        description: "Grouped complaint category."
        tests:
          - not_null

      - name: is_complete_day
        description: >
          Had the source published all of full_date at the time of this build?
          Joined from int_load_completeness, the single definition of a
          complete day.

          Three-valued. TRUE: coverage of the day reached the final
          complete_day_tail_minutes. FALSE: the day is partial. NULL: the day
          has left the loaded window, so this build cannot assess it. Filter
          on this before averaging across days; the newest loaded day is always
          FALSE because the source publishes on a ~23.5h lag. No not_null test,
          because NULL is a real value here.

      - name: total_requests
        description: >
          Count of service requests created on full_date in this borough and
          category. Not censored: it is whole once the source has published the
          day, so its qualifier is is_complete_day, not is_denominator_closed.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: undecodable_closure_requests
        description: >
          Of total_requests, how many carried resolution text the closure_type
          decoder could not read (closure_type = 'Undecodable'). Those rows are
          is_actioned = FALSE, so this sizes the floor under
          pct_actioned_within_window at the same grain.
          assert_closure_decode_coverage holds 'Undecodable' under 12% of
          text-bearing rows. Not censored, so always published.
        tests:
          - not_null

      - name: closure_window_days
        description: >
          The window every rate on this row is computed over: "closed within
          this many days of creation". The closure_window_days var (30, NYC's
          closure standard; also used by fct_service_requests.is_overdue).
        tests:
          - not_null

      - name: observation_days
        description: >
          Complete days of published history after full_date, measured to the
          same horizon fct_complaint_recurrence uses (the newest complete day in
          int_load_completeness). Floored at zero. NULL when the load contains
          no complete day.

      - name: is_denominator_closed
        description: >
          TRUE when every request created on this day has had the full window
          to close: observation_days >= closure_window_days AND the source
          published the whole day (is_complete_day IS DISTINCT FROM FALSE). The
          rate columns are NULL wherever this is FALSE.

          The second clause matters because a half-published day is a biased
          sample however old it gets. NULL is_complete_day (day left the load
          window) is allowed; otherwise no day in a long-lived warehouse would
          publish. Never NULL itself.
        tests:
          - not_null

      - name: requests_closed_within_window
        description: >
          Of total_requests, how many were closed within closure_window_days of
          creation. NULL where is_denominator_closed is FALSE.

      - name: requests_open_past_window
        description: >
          Of total_requests, how many were NOT closed within
          closure_window_days, including requests still open. NULL where
          is_denominator_closed is FALSE.

      - name: pct_closed_within_window
        description: >
          Fraction of requests created on this day that were closed within
          closure_window_days (0.0–1.0). NULL where is_denominator_closed is
          FALSE; on a load shorter than the window every value is NULL.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "pct_closed_within_window is not null"

      - name: pct_actioned_within_window
        description: >
          Fraction of requests created on this day that were closed within
          closure_window_days AND describe the city actually doing something
          (0.0–1.0). The gap between this and pct_closed_within_window is the
          share of in-window closures that found no violation, found nothing,
          were duplicates, or were handed off.

          Read undecodable_closure_requests beside it: rows the decoder could
          not read count as not actioned.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "pct_actioned_within_window is not null"

      - name: avg_resolution_days_within_window
        description: >
          Mean days to close among requests closed within closure_window_days,
          so it is fixed per cohort instead of creeping up as late closures
          arrive; pct_closed_within_window says what share it covers. NULL where
          is_denominator_closed is FALSE, or when nothing closed in the window.
