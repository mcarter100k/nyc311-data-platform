version: 2

models:

  # ── dim_agency ──────────────────────────────────────────────────────────────

  - name: dim_agency
    description: >
      Agency dimension. SCD Type 2 — one row per version of each agency record.
      A new version is opened whenever agency_name changes for a given
      agency_abbreviation. Abbreviation changes are not versioned; a new
      abbreviation is treated as a new agency. Multiple rows per agency are
      normal (one current, zero or more expired). Populated from agency_snapshot,
      which runs the dbt check strategy on agency_name. See ADR 007.
    columns:
      - name: agency_key
        description: >
          MD5 surrogate key on (agency_abbreviation, dbt_valid_from timestamp).
          Unique per version — the full timestamp (not effective_date) keeps
          same-day versions distinct. Old agency_key values are retained when a
          new version opens, so historical fact rows continue to resolve their FK.
        tests:
          - unique
          - not_null
      - name: agency_abbreviation
        description: >
          Short code identifying the agency (e.g. NYPD, DOT, DSNY). Natural key —
          stable across name-change versions. Not unique in this table because
          multiple versions of the same agency coexist.
        tests:
          - not_null
      - name: agency_name
        description: "Full agency name, initcap-normalized. The tracked changing attribute."
        tests:
          - not_null
      - name: effective_date
        description: "Date this version of the agency record became active."
        tests:
          - not_null
      - name: expiry_date
        description: >
          Date this version was superseded by a newer name. NULL for the current
          version. Cast from dbt_valid_to (snapshot timestamp) to DATE.
      - name: valid_from
        description: >
          Join-window start for the point-in-time join in fct_service_requests.
          Equals effective_date except for each agency's first version, which is
          backdated to 1900-01-01 so requests created before the first snapshot
          run still resolve to a version. Windows are half-open:
          [valid_from, expiry_date).
        tests:
          - not_null
      - name: is_current
        description: >
          TRUE for exactly one row per agency_abbreviation — the version with
          NULL expiry_date. The singular test assert_one_current_agency_per_
          abbreviation.sql enforces this constraint.
        tests:
          - not_null

  # ── dim_date ────────────────────────────────────────────────────────────────

  - name: dim_date
    description: >
      Calendar date dimension spanning 2010-01-01 through 2030-12-31 (controlled
      by project variables min_date / max_date). One row per calendar day.
      Contains calendar hierarchy attributes, weekend flag, and US federal
      holiday flag. No dependency on service request data — populated entirely
      from the generate_date_spine macro.
    columns:
      - name: date_id
        description: "Integer surrogate key in YYYYMMDD format. Sortable and human-readable."
        tests:
          - unique
          - not_null
      - name: full_date
        description: "Calendar date (DATE type). Join target for fct_service_requests.created_date_id."
        tests:
          - unique
          - not_null
      - name: year
        description: "4-digit calendar year."
        tests:
          - not_null
      - name: quarter
        description: "Calendar quarter (1–4)."
        tests:
          - not_null
      - name: month
        description: "Month number (1–12)."
        tests:
          - not_null
      - name: month_name
        description: "Full month name (e.g. January)."
        tests:
          - not_null
      - name: day_of_week
        description: >
          ISO day of week from dayofweekiso: 1=Monday … 7=Sunday. Immune to the
          Snowflake WEEK_START session/account parameter.
        tests:
          - not_null
      - name: is_weekend
        description: "TRUE for Saturday (6) and Sunday (7, ISO numbering). Used in volume trend analysis."
        tests:
          - not_null
      - name: is_federal_holiday
        description: "TRUE for the 11 US federal holidays. See model SQL for rule logic."
        tests:
          - not_null

  # ── dim_location ────────────────────────────────────────────────────────────

  - name: dim_location
    description: >
      Location dimension. One row per unique (borough, community_board, incident_zip)
      combination EVER observed in the service request dataset. Borough values are the
      standardized forms from int_service_requests_cleaned (five canonical names
      plus UNSPECIFIED). Null community boards and ZIP codes are coalesced to 'UNKNOWN'.

      Accumulating and append-only (materialized incremental, keyed on
      location_id). Members are never dropped when their source rows age out of
      Silver's rolling window, because fct_service_requests keeps history far
      past that window and its location_id must stay resolvable for as long as
      the fact row exists. Members are also immutable: the three attributes ARE
      the surrogate key, so a change to any of them yields a different
      location_id — a new member, never a restatement of an existing one.
    columns:
      - name: location_id
        description: "MD5 surrogate key on (borough, community_board, incident_zip)."
        tests:
          - unique
          - not_null
      - name: borough
        description: "Standardized borough name (BROOKLYN, MANHATTAN, QUEENS, BRONX, STATEN ISLAND, UNSPECIFIED)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BROOKLYN', 'MANHATTAN', 'QUEENS', 'BRONX', 'STATEN ISLAND', 'UNSPECIFIED']
      - name: community_board
        description: "Community board designation or 'UNKNOWN' when absent."
        tests:
          - not_null
      - name: incident_zip
        description: "5-digit ZIP code or 'UNKNOWN' when absent."
        tests:
          - not_null

  # ── fct_service_requests ────────────────────────────────────────────────────

  - name: fct_service_requests
    description: >
      Atomic fact table. One row per NYC 311 service request. Grain: unique_key.
      Clustered on cast(created_date as date) for time-range query performance
      in Snowflake. Foreign keys to dim_agency, dim_date, and dim_location. All
      dimension joins are LEFT joins to avoid losing records with null location
      or unrecognized agency. The dim_agency join is point-in-time on the SCD2
      validity window, so rebuilds are idempotent.
    columns:
      - name: service_request_id
        description: "MD5 surrogate key on unique_key."
        tests:
          - unique
          - not_null

      - name: unique_key
        description: "Natural key from NYC Open Data."
        tests:
          - unique
          - not_null

      - name: agency_id
        description: >
          Foreign key to dim_agency.agency_key, assigned point-in-time — the
          version whose [valid_from, expiry_date) window contains the request's
          created_date. Historical rows therefore point to expired versions
          (is_current=FALSE); the FK always resolves because SCD2 never deletes
          old dim_agency rows. NULL when the join is missed (the join is LEFT by
          design — dropping unmatched requests would under-count volume).
          No not_null test: the LEFT join is allowed to miss. The relationships
          test DOES hold, and not because the two models share a source — that
          reasoning was wrong for location_id and is not what saves this column
          either. It holds because dim_agency is built from a dbt snapshot, and
          snapshots never delete: a version stays in agency_snapshot after the
          agency stops appearing in Silver's rolling window (verified — an
          agency removed from the window kept its dim_agency row and its fact
          rows kept resolving), so the FK cannot dangle the way location_id did.
        tests:
          - relationships:
              arguments:
                to: ref('dim_agency')
                field: agency_key

      - name: created_date_id
        description: "Foreign key to dim_date (YYYYMMDD integer)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id

      - name: location_id
        description: >
          Foreign key to dim_location. NULL for records with no borough (the
          join is LEFT by design).

          This column carried no relationships test on the argument that
          dim_location is derived from the same source rows as this fact, so
          referential integrity held by construction. That was true only while
          Gold was rebuilt from scratch every run. It stopped being true when
          this fact became incremental: the fact accumulates, dim_location was
          rebuilt from Silver's rolling 7-day window, and every location that
          aged out of the window was dropped from the dimension while fact rows
          kept pointing at it. Measured on the production artifact: 88 dangling
          rows, all of them predating the window, growing ~15-20/day, with
          fct_daily_volume silently reattributing them to borough 'UNSPECIFIED'.
          dim_location now accumulates, and this test is the guard that would
          have caught it.
        tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_id

      - name: complaint_type
        description: "Raw complaint type (degenerate dimension — too high-cardinality for a standalone dim)."
        tests:
          - not_null

      - name: complaint_category
        description: "Grouped complaint category from the intermediate classification CASE WHEN."
        tests:
          - not_null

      - name: latitude
        description: "WGS84 latitude of the incident. NULL where the address was not geocodable (~15% at last manual measure; not continuously verified)."

      - name: longitude
        description: "WGS84 longitude of the incident. NULL wherever latitude is NULL."

      - name: resolution_days
        description: "Integer days between created_date and closed_date. NULL for open requests."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "resolution_days is not null"

      - name: is_resolved
        description: "TRUE when status = 'Closed'."
        tests:
          - not_null

      - name: is_overdue
        description: "TRUE when resolution_days > 30. NULL for open requests."

      - name: closure_type
        description: >
          How the request was closed (see int_service_requests_cleaned). The
          companion to status: status says the ticket is finished, closure_type
          says what finished it.

          'Unspecified' and 'Undecodable' are different facts and were one value
          until this pass: the source stating no resolution, versus the source
          stating one that no rule matched (8,330 rows, 7.34% of text-bearing
          rows on the local load).
        tests:
          - not_null

      - name: is_actioned
        description: >
          TRUE when closure_type is Resolved on Scene, Enforcement Action or
          Work Performed — i.e. the city did something. A request can be
          is_resolved = TRUE and is_actioned = FALSE; that is the majority case.

          FALSE is not proof of inaction. closure_type = 'Undecodable' also
          lands here — 8.45% of closed requests on the local load — and some of
          those strings plainly describe work ("NYC Parks performed the work
          necessary to correct the condition.", 310 rows). Any action rate built
          on this column should be read next to
          fct_daily_volume.undecodable_closure_requests, which sizes that floor.
        tests:
          - not_null

      - name: _loaded_at
        description: >
          Silver load timestamp (_silver_timestamp) carried forward from the
          staging layer. Incremental watermark for this table.
        tests:
          - not_null

      - name: schema_version
        description: >
          Schema contract version this row was last merged under. Stamped in the
          staging view but only durable here — the incremental merge writes it
          into physical rows, so after a var bump, untouched historical rows
          keep the version that built them. A --full-refresh restamps all
          history with the current version. See ADR 006.
        tests:
          - not_null

  # ── fct_daily_volume ────────────────────────────────────────────────────────

  - name: fct_daily_volume
    description: >
      Pre-aggregated daily volume fact. Grain: one row per (full_date, borough,
      complaint_category). Derived from fct_service_requests to avoid repeated
      large aggregations in BI queries. Suitable for time-series dashboards,
      complaint category trend analysis, and borough-level performance reporting.

      EVERY RATE ON THIS TABLE IS WINDOWED AND CONDITIONALLY SUPPRESSED. A rate
      whose numerator is "closed" over a denominator of "created on this day" is
      right-censored, and worst on the newest days — the ones a reader opens
      first. This table used to publish four such measures over an open-ended
      denominator; measured on the local load the same pct_resolved column read
      0.7452 at twelve complete days of observation and 0.4003 at zero. The
      replacements are bounded to closure_window_days and published only where
      is_denominator_closed, which is enforced by the
      assert_daily_volume_rates_have_closed_denominators singular test in both
      directions: no censored rate may be published, and no eligible non-empty
      day may be suppressed.

      REMOVED, and not replaced like-for-like: pct_resolved, pct_actioned,
      avg_resolution_days, overdue_requests. See requests_open_past_window for
      why overdue_requests could not simply be gated.
    columns:
      - name: daily_volume_id
        description: "MD5 surrogate key on (full_date, borough, complaint_category)."
        tests:
          - unique
          - not_null

      - name: full_date
        description: "Calendar date of the service requests being counted."
        tests:
          - not_null

      - name: borough
        description: >
          Standardized borough name. Fact rows with no location_id are folded
          into UNSPECIFIED by the model (coalesce), so this is never NULL.
        tests:
          - not_null

      - name: complaint_category
        description: "Grouped complaint category."
        tests:
          - not_null

      - name: is_complete_day
        description: >
          Had the source published all of full_date at the time of this build?
          Joined from int_load_completeness, the single definition of a
          complete day — the recurrence horizon reads the same model.

          THREE-VALUED. TRUE = the source's coverage of this day reached the
          final complete_day_tail_minutes. FALSE = it did not; the day is
          partial and its per-day figures are not comparable to a whole day's.
          NULL = the day has aged out of the loaded source window, so this
          build cannot assess it either way.

          Any average or comparison taken ACROSS days must filter on this. The
          newest day in any load is always FALSE, because the source publishes
          on a ~23.5h lag: measured 2026-08-26 it held 358 requests against a
          ~10,500 median, and letting a two-hour day into a daily mean is how
          the weekday-vs-weekend volume figures were contaminated.

          No not_null test, deliberately — NULL is a meaning this column has.

      - name: total_requests
        description: >
          Count of service requests opened on full_date in this borough and
          category. The one measure here that is NOT censored: a created-count
          is whole as soon as the source has published the day, and no later
          closure can change it. Its qualifier is is_complete_day, not
          is_denominator_closed.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: undecodable_closure_requests
        description: >
          Of total_requests, how many carried resolution text that the
          closure_type decoder could not read (closure_type = 'Undecodable').
          Those rows are is_actioned = FALSE by construction, so this is the
          size of the decode-shaped floor underneath pct_actioned_within_window
          at exactly the grain that percentage is published at — the number that
          lets a reader tell a real action rate from a decoder failure.

          Measured on the local load: 8,330 rows table-wide, 7.34% of every row
          carrying resolution text and 8.45% of all CLOSED requests. Held under
          12% of text-bearing rows by the assert_closure_decode_coverage
          singular test.

          Published unconditionally — it is a property of the rows themselves,
          not of how long they have been observed, so nothing about it is
          censored and nothing about it needs suppressing.
        tests:
          - not_null

      - name: closure_window_days
        description: >
          The window every rate on this row is computed over: "closed within
          this many days of creation", never "closed by now". Carried as data so
          a consumer reading one row knows what the percentages mean without
          looking up a project var. Sourced from the closure_window_days var,
          which is 30 — the NYC administrative standard already encoded in
          fct_service_requests.is_overdue.
        tests:
          - not_null

      - name: observation_days
        description: >
          Complete days of published history following full_date, measured
          against the same horizon fct_complaint_recurrence uses: MAX(load_day)
          WHERE is_complete_day from int_load_completeness, never
          max(created_date). Floored at zero — a day at or after the horizon has
          had no observed time, not negative time.

          NULL when the load contains no complete day at all, which is the one
          case where no honest horizon exists. Written out explicitly in the
          model rather than left to GREATEST, whose NULL handling differs
          between Snowflake and DuckDB.

      - name: is_denominator_closed
        description: >
          TRUE when every request created on this day has had a full and equal
          opportunity to enter the window numerators — observation_days >=
          closure_window_days AND the source published the whole day
          (is_complete_day IS DISTINCT FROM FALSE). The rate columns below are
          NULL wherever this is FALSE.

          The second clause is not redundant with the first: a day the source
          published only the first two hours of is a biased sample of itself no
          matter how old it gets, which is the shape the 2026-08-18 publish
          stall produced. It is DISTINCT FROM FALSE rather than = TRUE because
          NULL means "this day has aged out of the assessable load window", not
          "incomplete" — and = TRUE would suppress every rate in a warehouse
          whose fact outlives the load window, i.e. all of production.

          Two-valued, never NULL: with no complete day in the load the AND
          short-circuits to FALSE, so "we cannot assess this" publishes nothing
          rather than publishing an unknown.
        tests:
          - not_null

      - name: requests_closed_within_window
        description: >
          Of total_requests, how many were closed within closure_window_days of
          creation. NULL where is_denominator_closed is FALSE.

      - name: requests_open_past_window
        description: >
          Of total_requests, how many were NOT closed within
          closure_window_days. NULL where is_denominator_closed is FALSE.

          This replaces overdue_requests, which was broken independently of
          censoring. That column summed is_overdue, and is_overdue is
          deliberately NULL while a request is open (see
          assert_is_overdue_null_while_open) — so a request created 200 days ago
          and still open, the worst outcome the data can express, contributed
          ZERO to the overdue count while one closed on day 31 contributed one.
          It counted only lateness that had already ended. This column counts
          both, and is knowable at exactly the moment the other window measures
          are.

      - name: pct_closed_within_window
        description: >
          Fraction of requests created on this day that were closed within
          closure_window_days (0.0–1.0). NULL where is_denominator_closed is
          FALSE — which is the whole point of the column: on a 7–14 day load no
          day is eligible and this reads NULL everywhere, because a 14-day load
          cannot answer a 30-day question.

          Replaces pct_resolved, whose denominator was open-ended.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "pct_closed_within_window is not null"

      - name: pct_actioned_within_window
        description: >
          Fraction of requests created on this day that were closed within
          closure_window_days AND describe the city actually doing something
          (0.0–1.0). The gap between this and pct_closed_within_window is the
          share of in-window closures that found no violation, found nothing,
          were duplicates, or were handed off.

          Read undecodable_closure_requests beside it. Rows whose resolution
          text the decoder could not read are is_actioned = FALSE, so this
          figure has a floor under it of known size rather than unknown size.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "pct_actioned_within_window is not null"

      - name: avg_resolution_days_within_window
        description: >
          Mean days to close AMONG requests closed within closure_window_days.
          Stated that way deliberately: a mean over "all closures so far" is a
          mean over a set that keeps growing, and grows slowest at the top, so
          it slides upward for months after the cohort is created. Bounded, it
          is a fixed quantity per cohort, and pct_closed_within_window beside it
          says what share of the cohort it describes.

          NULL where is_denominator_closed is FALSE, and also NULL for an
          eligible group in which nothing closed inside the window.

          Replaces avg_resolution_days, which averaged every closure to date and
          fell 1.38 → 0.07 across the local load purely as a function of how
          recent the day was.

