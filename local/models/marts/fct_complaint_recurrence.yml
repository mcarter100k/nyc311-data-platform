version: 2

models:
  - name: fct_complaint_recurrence
    description: >
      One row per closed service request that carries a usable address, with
      the time until the next identical complaint at the same address.

      The only test of resolution quality available from 311 alone:
      closure_type records what the city said happened, not whether the
      problem went away. A closure followed by the same complaint three days
      later did not resolve anything.

      Read with care. observation_days guards right-censoring: a rate over N
      days must keep only rows with observation_days >= N. is_chronic_location
      marks addresses that recur by nature; an unfiltered rate is dominated by
      them. Rebuilt each run from the current Silver window (37 days), so
      observation_days never exceeds ~36.

      Recurrence is evidence, not proof. A repeat complaint may mean the fix
      failed, or that the condition is legal and residents keep reporting it.
    columns:
      - name: service_request_id
        description: "Surrogate key of the closed request being assessed."
        tests:
          - unique
          - not_null

      - name: address_key
        description: "Upper-trimmed incident_address. Identity is textual, not geocoded."
        tests:
          - not_null

      - name: closure_type
        description: "How this request was closed — the dimension recurrence is compared across."
        tests:
          - not_null

      - name: days_to_next_same_complaint
        description: >
          Days from this closure to the next same-address, same-type complaint.
          NULL means none was observed inside the bounded window — which is NOT
          the same as "fixed". Always read alongside observation_days.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "days_to_next_same_complaint is not null"

      - name: observation_days
        description: >
          Complete days of published history after this closure, measured to
          the newest complete day in int_load_completeness (not the newest
          loaded day, which is always partial). A rate over N days is only
          valid across rows where this is >= N. Floored at zero.

          NULL means the load holds no complete day; the not_null test turns
          that into a failed build rather than a table of zeros.
        tests:
          - not_null

          # No `>= 0` test: the column is GREATEST(0, ...), so it cannot fail.
          # A wrong horizon is caught by assert_recurrence_horizon_is_last_complete_day
          # (too far forward) and assert_observation_days_floor_is_explained
          # (too far back or frozen); tests/local/test_local_gold.py proves both fire.

      - name: location_ticket_count
        description: "Tickets at this (address, complaint_type) in the loaded window."
        tests:
          - not_null

      - name: is_chronic_location
        description: >
          TRUE when this address+type is at or above chronic_location_min_tickets.
          Such locations dominate any unfiltered recurrence rate.
        tests:
          - not_null
