version: 2

models:
  - name: int_service_requests_cleaned
    description: >
      Cleaned and enriched service requests. Applies borough standardization,
      computes resolution_days, classifies complaint_category, and filters out
      records where closed_date precedes created_date. This is the single source
      of truth for all mart models — all business logic lives here.
    columns:

      # Uniqueness of service_request_id / unique_key is asserted at the
      # boundary (stg_service_requests) and on the published artifact
      # (fct_service_requests). This pass-through layer cannot introduce
      # duplicates, so repeating the unique tests here would only add two more
      # full-table scans per `dbt test` with no added signal.
      - name: service_request_id
        description: "MD5 surrogate key inherited from staging. Unique per service request."
        tests:
          - not_null

      - name: unique_key
        description: "Natural key from NYC Open Data."
        tests:
          - not_null

      - name: borough_clean
        description: >
          Standardized borough name. All raw variants (BK, Bklyn, KINGS, etc.)
          are mapped to one of five canonical values. Unrecognized values become
          UNSPECIFIED. This column is the join key for dim_location.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'BROOKLYN'
                  - 'MANHATTAN'
                  - 'QUEENS'
                  - 'BRONX'
                  - 'STATEN ISLAND'
                  - 'UNSPECIFIED'

      - name: complaint_category
        description: >
          Grouped complaint category derived from complaint_type via CASE WHEN
          pattern matching (21 operational categories plus 'Other'). Categories
          follow how the city is organised, so each maps to an accountable
          agency. 'Other' is held under 5% by the
          assert_complaint_classification_coverage singular test.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Noise'
                  - 'Heat & Hot Water'
                  - 'Animals'
                  - 'Rodent'
                  - 'Abandoned Vehicle'
                  - 'Taxi & For-Hire Vehicle'
                  - 'Illegal Parking'
                  - 'Street Light'
                  - 'Traffic & Signals'
                  - 'Sanitation'
                  - 'Illegal Dumping'
                  - 'Parks & Trees'
                  - 'Street Condition'
                  - 'Graffiti'
                  - 'Homeless Services'
                  - 'Environmental Hazard'
                  - 'Construction & Building Code'
                  - 'Water & Sewer'
                  - 'Housing & Building Maintenance'
                  - 'Public Safety & Quality of Life'
                  - 'Consumer & Business'
                  - 'Other'

      - name: closure_type
        description: >
          How the request was closed, derived from the templated
          resolution_description text. 'Closed' status alone does not mean the
          problem was fixed: on one week of live data only 36.7% of closed
          requests describe any action. Action outcomes are Resolved on Scene,
          Enforcement Action and Work Performed; the rest closed without the
          city doing anything. 'Unspecified' covers null text plus boilerplate
          that states no outcome ("see notes", "status is on our website").
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Resolved on Scene'
                  - 'Enforcement Action'
                  - 'Work Performed'
                  - 'No Violation Found'
                  - 'No Condition Found'
                  - 'Access Failed'
                  - 'Duplicate'
                  - 'Referred Elsewhere'
                  - 'Pending'
                  - 'Unspecified'

      - name: resolution_days
        description: >
          Integer days between created_date and closed_date. NULL for open
          requests. Negative values are filtered out by the quality filter in
          this model and should never appear here.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "resolution_days is not null"

      - name: created_date
        description: "Timestamp when the service request was submitted. Never null."
        tests:
          - not_null

      - name: agency_abbreviation
        description: "Short agency code. UNKNOWN sentinel applied by Silver for null/empty values."
        tests:
          - not_null
