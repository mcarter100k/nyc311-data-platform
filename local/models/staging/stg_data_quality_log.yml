version: 2

models:
  - name: stg_data_quality_log
    description: >
      Passthrough view over the Silver data_quality_log table (one row per
      quality check per pipeline run date). Exists so fct_data_quality, its only
      consumer, reads through staging like every other model.
    tests:
      # Duplicate (run_date, check_name) rows would corrupt fct_data_quality's
      # rolling averages.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - run_date
              - check_name
    columns:
      - name: run_date
        description: >
          UTC date of the pipeline run (YYYY-MM-DD string). With check_name,
          the grain of the log.
        tests:
          - not_null

      - name: check_name
        description: >
          Identifier for the quality check (e.g. null_rate_unique_key,
          duplicate_rate, invalid_resolution_days). fct_data_quality partitions
          its 7-day rolling averages by this column.
        tests:
          - not_null

      - name: records_checked
        description: "Number of records in scope for this check on this run date."

      - name: records_failed
        description: "Number of records that failed this check on this run date."

      - name: failure_rate
        description: >
          records_failed / records_checked, range 0.0–1.0. The raw input to the
          rolling-average and threshold-breach logic in fct_data_quality.

      - name: pipeline_stage
        description: "Pipeline layer that produced the check. Always 'silver' for rows written by the Silver transform."
