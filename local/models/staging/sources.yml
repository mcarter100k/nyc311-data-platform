version: 2

sources:
  - name: silver
    database: nyc311_local
    schema: silver
    tables:
      - name: service_requests
        columns:
          - name: unique_key
            tests:
              - unique
              - not_null
          - name: created_date
            tests:
              - not_null
          # Parity with dbt/models/staging/sources.yml: same source contract
          # columns tested on both sides. Freshness is not configured here —
          # local freshness is enforced by SLO-1 (scripts/slo/slo1_freshness.sql)
          # on every scheduled run instead of `dbt source freshness`.
          - name: agency
            tests:
              - not_null
          - name: complaint_type
            tests:
              - not_null
      - name: quarantine
        description: >
          Rows the Silver transform rejected this run, retained rather than
          discarded. Quarantine happens in pandas before dbt sees anything, so
          without this table a row loaded by an earlier run and rejected by a
          later one stays in Gold forever: the fact table's reconciliation
          post_hook can only see rows that reached staging, and a quarantined
          row never does. Replaced every run, never appended — it means "rejected
          by the CURRENT fetch". A growing history would be actively wrong, since
          a row the city later corrects must stop being listed or the post_hook
          would delete a valid row from Gold on every subsequent run.
        columns:
          - name: unique_key
            description: "Natural key of the rejected request; the join key the post_hook deletes on."
            tests:
              - not_null
              - unique
          - name: quarantine_reason
            description: "Why the row was rejected. 'negative_resolution_days' is the only value today."
            tests:
              - not_null
      - name: data_quality_log
        columns:
          - name: run_date
            tests:
              - not_null
          - name: check_name
            tests:
              - not_null
