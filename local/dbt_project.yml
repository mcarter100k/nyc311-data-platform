name: 'nyc311_local'
version: '1.0.0'
config-version: 2

profile: 'nyc311_local'

model-paths:    ["models"]
# Mirrors dbt/tests: the three singular Gold-integrity tests run here on every
# dbt build, so "all dbt tests passed" in local_runner reflects the real suite.
test-paths:     ["tests"]
macro-paths:    ["macros"]
# Shared with the Snowflake project AND the Python pipelines: one canonical
# borough mapping outside both dbt trees (see config/borough_variants.csv).
seed-paths:     ["../config"]
snapshot-paths: ["snapshots"]

target-path:   "target"
clean-targets: ["target", "dbt_packages"]

models:
  nyc311_local:
    staging:
      +materialized: view
    intermediate:
      # Table for parity with the Snowflake project: three models read this,
      # and the ILIKE classification should compute once, not per consumer.
      +materialized: table
    marts:
      +materialized: table
      +schema: gold

vars:
  min_date: '2010-01-01'
  max_date: '2030-12-31'
  schema_version: '1'

  # fct_complaint_recurrence. The join to later complaints is bounded by this
  # window — correctness-preserving for the question (nobody asks about
  # recurrence a year later) and what keeps a self-join over a chronic address
  # from fanning out quadratically.
  recurrence_max_window_days: 30

  # An (address, complaint_type) pair at or above this ticket count is treated
  # as a chronic location: it recurs by nature rather than by failed
  # resolution, and it dominates any unfiltered recurrence rate.
  chronic_location_min_tickets: 5

  # fct_daily_volume. Every rate on that table is bounded to this window
  # ("closed within N days of creation", not "closed by now") and is published
  # only for days that N complete days of history follow. Days newer than that
  # publish NULL, because their denominators are still filling: measured on a
  # 14-day local load the same pct_resolved column read 0.7452 at 12 days
  # observed and 0.4003 at zero, and the second number is not a bad day for the
  # city, it is a cohort that has not happened yet.
  #
  # 30 is not a free parameter. It is the NYC administrative standard already
  # encoded in fct_service_requests.is_overdue (resolution_days > 30), so the
  # window this table publishes over and the deadline the city is held to stay
  # one number in one place. Consequence, stated rather than hidden: on a 7–14
  # day mirror NO day is eligible and every rate column reads NULL — the correct
  # answer for a 14-day load asked a 30-day question.
  closure_window_days: 30

  # int_load_completeness. A loaded day counts as COMPLETE when the newest
  # request created on it lands within this many minutes of midnight.
  #
  # The value is deliberately not fine-tuned, because the quantity it cuts is
  # bimodal by three orders of magnitude: on a 14-day live load every complete
  # day ended 1 minute short of midnight and the trailing partial day ended
  # 1,314 minutes short. Anything from ~5 to ~600 gives the same verdicts. 60
  # is chosen as an hour — a value a reader can reason about — with the failure
  # direction being conservative either way: too tight retires a complete day
  # (understating observation time), never the reverse.
  complete_day_tail_minutes: 60
