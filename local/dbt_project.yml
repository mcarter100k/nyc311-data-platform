name: 'nyc311_local'
version: '1.0.0'
config-version: 2

profile: 'nyc311_local'

model-paths:    ["models"]
# Mirrors dbt/tests: the three singular Gold-integrity tests run here on every
# dbt build, so "all dbt tests passed" in local_runner reflects the real suite.
test-paths:     ["tests"]
macro-paths:    ["macros"]
# Shared with the Snowflake project AND the Python pipelines: one canonical
# borough mapping outside both dbt trees (see config/borough_variants.csv).
seed-paths:     ["../config"]
snapshot-paths: ["snapshots"]

target-path:   "target"
clean-targets: ["target", "dbt_packages"]

models:
  nyc311_local:
    staging:
      +materialized: view
    intermediate:
      # Table for parity with the Snowflake project: three models read this,
      # and the ILIKE classification should compute once, not per consumer.
      +materialized: table
    marts:
      +materialized: table
      +schema: gold

vars:
  min_date: '2010-01-01'
  max_date: '2030-12-31'
  schema_version: '1'

  # fct_complaint_recurrence. The join to later complaints is bounded by this
  # window — correctness-preserving for the question (nobody asks about
  # recurrence a year later) and what keeps a self-join over a chronic address
  # from fanning out quadratically.
  recurrence_max_window_days: 30

  # An (address, complaint_type) pair at or above this ticket count is treated
  # as a chronic location: it recurs by nature rather than by failed
  # resolution, and it dominates any unfiltered recurrence rate.
  chronic_location_min_tickets: 5
