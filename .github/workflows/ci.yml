name: CI

# Four parallel jobs, split by what each tier needs installed. The first three
# are required checks (terraform/github); a red one names its tier directly.
#   fast-gate         — dbt + pyyaml: dbt parse, structural pytest (manifest,
#                       DAG graph, Terraform, workflows, pure-Python helpers),
#                       the claim and model-drift checkers, ruff, actionlint.
#   unit              — pandas: the Silver transforms.
#   behavioral-duckdb — duckdb + dbt-duckdb: two seeded dbt builds, the SLO
#                       gate, the stage-3 loader and the mocked fetcher.
#   front-door        — ./run_tests.sh from a clean checkout.
# See ADR 011. Every job sets timeout-minutes (default is 6 hours) at several
# times its normal duration, so a hang is reported in minutes.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  fast-gate:
    name: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: pip install -r dbt/requirements.txt

      # dbt/ci-profile/profiles.yml is a committed, credential-free profile.
      - name: dbt deps
        run: dbt deps --profiles-dir ci-profile --project-dir . --no-version-check
        working-directory: dbt

      # parse, not compile: compile opens a Snowflake connection. parse checks
      # refs, macros and YAML; it does not check the Snowflake SQL itself.
      - name: dbt parse (compile without connecting)
        run: dbt parse --profiles-dir ci-profile --project-dir . --target ci --no-version-check
        working-directory: dbt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Rules are in ruff.toml.
      - name: ruff (Python lint)
        run: ruff check . --output-format=github

      # The unit and local tiers run in their own jobs.
      - name: Structural pytest
        run: pytest tests/ --ignore=tests/unit --ignore=tests/local -q -ra --junitxml=structural-report.xml

      # A skipped test is not a pass. Every tier fails on any skip.
      - name: Enforce zero skips
        run: |
          python - << 'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("structural-report.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          assert tests > 0, "zero structural tests collected — the tier is hollow"
          assert skipped == 0, f"{skipped} test(s) skipped — this job exists so importorskip can never hollow it out"
          print(f"{tests} structural tests ran, 0 skipped")
          EOF

      # Fails if README.md or docs/ disagree with the repo: counts, links,
      # citations, DAG task names, the dbt model inventory. Needs the manifest
      # from dbt parse above (exits 2 without it).
      - name: Check README and docs/ claims against the repo
        run: python scripts/check_claims.py

      # Fails if dbt/ and local/ models differ beyond the recorded dialect
      # differences.
      - name: Check dbt/local model mirror drift
        run: python scripts/check_model_drift.py

      - name: actionlint (workflow lint)
        env:
          # actionlint runs shellcheck on run: scripts; only warnings and
          # errors fail, not style notes. ADR 011.
          SHELLCHECK_OPTS: --severity=warning
        # Pinned by version and sha256 because Dependabot does not track it.
        # To bump, update both (sha256 from actionlint_<ver>_checksums.txt on
        # the release page).
        run: |
          ver="1.7.12"
          sha="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          echo "${sha}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/unit/requirements.txt

      - name: Unit tests
        run: pytest tests/unit -v -ra --junitxml=unit-report.xml

      # The tier importorskips pandas so a bare laptop skips; here a skip fails.
      - name: Enforce zero skips
        run: |
          python - << 'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("unit-report.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          assert tests > 0, "zero unit tests collected — the tier is hollow"
          assert skipped == 0, f"{skipped} test(s) skipped — this job exists so importorskip can never hollow it out"
          print(f"{tests} unit tests ran, 0 skipped")
          EOF

  behavioral-duckdb:
    name: behavioral-duckdb
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      # local/requirements.txt pins dbt-duckdb and dbt-core, plus pandas and
      # requests for the fetch tests.
      - name: Install pipeline and test dependencies
        run: pip install -r local/requirements.txt -r requirements-dev.txt

      # Two seeded dbt builds (incremental watermark, snapshot renames, SCD2
      # point-in-time join, upserts), the SLO gate, the stage-3 loader and the
      # mocked fetcher.
      - name: Behavioral tests
        run: pytest tests/local -v -ra --junitxml=local-report.xml

      # Every test here sits behind an importorskip, so a dependency that stops
      # resolving would turn them all into skips. A skip is not a pass.
      - name: Enforce zero skips
        run: |
          python - << 'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("local-report.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          assert tests > 0, "zero behavioral tests collected — the tier is hollow"
          assert skipped == 0, f"{skipped} test(s) skipped — this job exists so importorskip can never hollow it out"
          print(f"{tests} behavioral tests ran, 0 skipped")
          EOF

  # Runs ./run_tests.sh from a clean checkout, the path the README documents.
  # The other jobs call pytest directly, so only this one tests the script.
  # Not a required check.
  front-door:
    name: front-door
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      # The README quickstart, verbatim. If this line drifts from the README
      # quickstart, this job no longer tests the documented path.
      - name: Install exactly what the README quickstart installs
        run: pip install -r local/requirements.txt -r dbt/requirements.txt -r requirements-dev.txt

      # A clean checkout has no manifest and no dbt/profiles.yml. Assert it, so
      # the job cannot quietly start testing a warmed-up tree.
      - name: Assert the checkout really is cold
        run: |
          test ! -e dbt/target/manifest.json || { echo "manifest.json present — this job is not testing a clean checkout"; exit 1; }
          test ! -e dbt/profiles.yml        || { echo "profiles.yml present — this job is not testing a clean checkout"; exit 1; }

      - name: ./run_tests.sh
        run: ./run_tests.sh
