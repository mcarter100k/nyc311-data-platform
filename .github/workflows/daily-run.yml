name: Daily Live Run

# Cron is 10:00 UTC (06:00 New York in summer); GitHub typically starts it
# 3-8h late. workflow_dispatch is for manual runs and replays. See ADR 010.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      window_days:
        description: >
          Width of the fetch window in days. Leave at 37 for a normal run. Widen
          it to replay a range: every row in the window is re-fetched and
          upserted, so stored statuses refresh. No fact row is deleted. The
          800,000-row cap limits one run to roughly 75 days.
        required: false
        default: "37"

permissions:
  contents: read
  issues: write

# One run at a time: overlapping runs would race the issue dedup below
# (list, then create) and the cached DuckDB. Queue rather than cancel, so a
# manual run still happens after the scheduled one.
concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  daily-run:
    name: Live fetch, build, SLO check
    runs-on: ubuntu-latest

    # The default is 6 hours, and a hung run holds the queue above into the
    # next day's trigger. A 37-day run takes about 8 minutes.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pipeline dependencies
        run: pip install -r local/requirements.txt

      # Gold builds incrementally on the previous run's database: the fact
      # table merges, the SCD2 snapshot spans runs, and the DQ log keeps its
      # history. Keys are per run; restore-keys picks the newest save.
      - name: Restore previous DuckDB (incremental accumulation)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: local/data/nyc311_local.duckdb
          key: nyc311-duckdb-${{ github.run_id }}
          restore-keys: |
            nyc311-duckdb-

      # Fetches every request created in the trailing 37 days, so 30-day
      # closure rates see closures up to day 30 plus the source's settling lag.
      # Transient HTTP errors (429, 5xx) are retried; any other failure,
      # including a row-cap hit or zero rows, fails the run rather than loading
      # partial data. An unset SOCRATA_APP_TOKEN means unauthenticated requests.
      - name: Run live pipeline (fetch → bronze → silver → dbt build)
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          # Scheduled runs have no inputs, so this falls back to 37.
          WINDOW_DAYS: ${{ github.event.inputs.window_days || '37' }}
        run: python local/local_runner.py --live --days "$WINDOW_DAYS"

      # Save only on success, so the next run starts from the last good
      # database rather than a partial one.
      - name: Save DuckDB for the next run
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: local/data/nyc311_local.duckdb
          key: nyc311-duckdb-${{ github.run_id }}

      # Always upload: a failed run is when the evidence matters most. The
      # raw JSON ships with the database because bronze is a view over that
      # file (ADR 014); without it the downloaded database's bronze layer
      # cannot be queried. Artifacts on a public repo are downloadable by any
      # GitHub user, so this must stay public data only.
      - name: Upload DuckDB artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nyc311-duckdb-${{ github.run_id }}
          path: |
            local/data/nyc311_local.duckdb
            local/data/raw/nyc311_raw.json
          retention-days: 14
          if-no-files-found: warn

      # Runs scripts/slo/*.sql, the same queries docs/SLO.md shows
      # (check_claims fails CI if they differ).
      - name: Check SLOs
        run: python scripts/check_slos.py local/data/nyc311_local.duckdb --report slo_report.md

      # Warning only (exits 0): if the city stops publishing, file an
      # upstream-stall issue while the run stays green.
      - name: Check upstream publish volume (warning only)
        id: upstream
        run: python scripts/check_upstream_stall.py local/data/nyc311_local.duckdb --report upstream_report.md

      - name: File or update upstream-stall notice
        if: steps.upstream.outputs.stall == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |

          {
            echo "## Upstream publish stall — $(date -u +%F)"
            echo ""
            echo "Run: $RUN_URL (green: the pipeline loaded everything the source published)"
            echo ""
            cat upstream_report.md
          } > stall_body.md

          # One open issue per label: comment on it if it exists. Labels are
          # declared in terraform/github. This stream tracks the city's
          # outages, not ours.
          existing=$(gh issue list --label upstream-stall --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file stall_body.md
          else
            gh issue create \
              --title "Upstream publish stall: $(date -u +%F)" \
              --label upstream-stall \
              --body-file stall_body.md
          fi

      - name: File or update breach issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |

          {
            echo "## Daily run failed — $(date -u +%F)"
            echo ""
            echo "Run: $RUN_URL"
            echo ""
            if [ -f slo_report.md ]; then
              echo "SLO measurements from this run:"
              echo ""
              cat slo_report.md
            else
              echo "The pipeline failed before the SLO check ran (fetch, build,"
              echo "or dbt tests) — see the run log above for the failing stage."
            fi
          } > breach_body.md

          # One open issue per label: comment on it if it exists.
          existing=$(gh issue list --label daily-run-breach --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file breach_body.md
          else
            gh issue create \
              --title "Daily run breach: $(date -u +%F)" \
              --label daily-run-breach \
              --body-file breach_body.md
          fi
