name: Daily Live Run

# 10:00 UTC = 06:00 America/New_York while DST is in effect. GitHub cron has
# no timezone anchor, so when DST ends the same trigger fires at 05:00 local —
# accepted drift, documented in ADR 010. workflow_dispatch exists for manual
# runs and for the post-merge verification of this workflow itself.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      window_days:
        description: >
          Width of the fetch window in days. Leave at 7 for a normal run. Widen it
          to replay a range — dimensions rebuild from this window, so a dimension
          can lose members the accumulating fact table still references, and one
          wide build re-seats them without deleting any fact row.
        required: false
        default: "7"

permissions:
  contents: read
  issues: write

# One run at a time: a manual dispatch overlapping the cron run would race the
# non-atomic issue-dedup below (list → create) and could file duplicate breach
# issues, and both runs would fight over the cached DuckDB. Queue, don't
# cancel — a manual run should still happen after the scheduled one finishes.
concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  daily-run:
    name: Live fetch, build, SLO check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pipeline dependencies
        run: pip install -r local/requirements.txt

      # Restore the previous run's database so Gold builds INCREMENTALLY on
      # top of accumulated state — the fact table merges, the SCD2 snapshot
      # spans runs, and the DQ log grows real 7-day history. Without this,
      # every scheduled run was a from-scratch --full-refresh and the
      # incremental path the spec describes never executed live.
      # restore-keys picks the most recent prior save (keys are per-run).
      - name: Restore previous DuckDB (incremental accumulation)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: local/data/nyc311_local.duckdb
          key: nyc311-duckdb-${{ github.run_id }}
          restore-keys: |
            nyc311-duckdb-

      # Trailing-7-day created_date window, hard 150k row cap, no retries
      # beyond one — any failure here is a red run, never a partial load.
      # SOCRATA_APP_TOKEN reaches the fetcher via env (local_runner.py reads
      # os.environ); an unset secret resolves to empty, which the runner
      # treats as unauthenticated.
      - name: Run live pipeline (fetch → bronze → silver → dbt build)
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          # Scheduled runs have no inputs context, so this resolves to 7.
          WINDOW_DAYS: ${{ github.event.inputs.window_days || '7' }}
        run: python local/local_runner.py --live --days "$WINDOW_DAYS"

      # Save only on success: a failed run must not advance the cached state,
      # so the next run restores the last GOOD database instead of a
      # possibly partial one.
      - name: Save DuckDB for the next run
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: local/data/nyc311_local.duckdb
          key: nyc311-duckdb-${{ github.run_id }}

      # `always()`: a pipeline failure is exactly when the evidence file is
      # needed for the postmortem — upload whatever exists, even mid-build
      # state. NOTE (conscious trade-off): artifacts on a public repo are
      # downloadable by any logged-in GitHub user for the retention window.
      # This database holds only public NYC 311 data; keep it that way, or
      # gate this upload before landing anything non-public.
      #
      # The raw JSON ships WITH the database, and must keep doing so. Since
      # ADR 014, bronze.service_requests is a view over that file rather than a
      # copy of it, so a database downloaded on its own has a Bronze layer that
      # raises `IO Error: No files found` on first query. Gold and Silver are
      # materialised and survive; raw — the thing a postmortem most wants —
      # does not. Uploading the pair keeps the evidence bundle self-contained.
      - name: Upload DuckDB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nyc311-duckdb-${{ github.run_id }}
          path: |
            local/data/nyc311_local.duckdb
            local/data/raw/nyc311_raw.json
          retention-days: 14
          if-no-files-found: warn

      # Executes the same scripts/slo/*.sql that docs/SLO.md displays —
      # check_claims fails CI if those two ever differ, so there is exactly
      # one copy of each contract query in play.
      - name: Check SLOs
        run: python scripts/check_slos.py local/data/nyc311_local.duckdb --report slo_report.md

      # WARNING path, not a gate (exit 0 either way): the volume-cliff check
      # that used to be SLO-2. A city publishing outage no longer reddens
      # this run — SLO-2 now verifies we loaded everything the source
      # published — but the stall must stay visible, so a labeled issue is
      # filed/updated below while the run stays green.
      - name: Check upstream publish volume (warning only)
        id: upstream
        run: python scripts/check_upstream_stall.py local/data/nyc311_local.duckdb --report upstream_report.md

      - name: File or update upstream-stall notice
        if: steps.upstream.outputs.stall == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |

          {
            echo "## Upstream publish stall — $(date -u +%F)"
            echo ""
            echo "Run: $RUN_URL (green: the pipeline loaded everything the source published)"
            echo ""
            cat upstream_report.md
          } > stall_body.md

          # Label declared in terraform/github, not created here.
          # Same one-open-issue dedup pattern as the breach stream, separate
          # label: this thread tracks the CITY's outage, not our failures.
          existing=$(gh issue list --label upstream-stall --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file stall_body.md
          else
            gh issue create \
              --title "Upstream publish stall: $(date -u +%F)" \
              --label upstream-stall \
              --body-file stall_body.md
          fi

      - name: File or update breach issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |

          {
            echo "## Daily run failed — $(date -u +%F)"
            echo ""
            echo "Run: $RUN_URL"
            echo ""
            if [ -f slo_report.md ]; then
              echo "SLO measurements from this run:"
              echo ""
              cat slo_report.md
            else
              echo "The pipeline failed before the SLO check ran (fetch, build,"
              echo "or dbt tests) — see the run log above for the failing stage."
            fi
          } > breach_body.md

          # Labels are declared in terraform/github (applied), not created here.
          # They were previously `gh label create ... --force || true` on every
          # run: infrastructure made as a job side effect, with failure swallowed.

          # One open issue per breach stream: comment on the existing one
          # rather than opening a duplicate every day a breach persists.
          existing=$(gh issue list --label daily-run-breach --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file breach_body.md
          else
            gh issue create \
              --title "Daily run breach: $(date -u +%F)" \
              --label daily-run-breach \
              --body-file breach_body.md
          fi
