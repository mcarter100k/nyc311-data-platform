name: dbt CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install -r dbt/requirements.txt

      # profiles.yml is gitignored (it holds credentials in real environments).
      # Write a placeholder profile at runtime — dbt parse validates the profile
      # schema but never opens a Snowflake connection.
      - name: Write mock CI profiles.yml
        run: |
          cat > dbt/profiles.yml << 'EOF'
          nyc311:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "placeholder.us-east-1"
                user: ci_user
                password: ci_password
                role: NYC311_TRANSFORMER
                database: NYC311_DB
                warehouse: NYC311_WH
                schema: gold
                threads: 1
                client_session_keep_alive: false
          EOF

      - name: dbt deps
        run: dbt deps --profiles-dir . --project-dir . --no-version-check
        working-directory: dbt

      - name: dbt parse (compile without connecting)
        # dbt compile triggers a Snowflake connection even with placeholder credentials.
        # dbt parse validates the project and writes the manifest with no DB connection —
        # the same approach used by run_tests.sh locally.
        run: dbt parse --profiles-dir . --project-dir . --target ci --no-version-check
        working-directory: dbt

      - name: Install test dependencies
        run: |
          pip install pytest pyyaml
          pip install pytest-github-actions-annotate-failures || true

      - name: Run pytest (excluding PySpark unit tests)
        run: pytest tests/ --ignore=tests/unit -v
