name: Daily Run Heartbeat

# Checks from outside daily-run.yml that it is still enabled and has
# succeeded on main recently. check_slos.py runs inside the daily run, so it
# cannot report a run that never starts: GitHub disables scheduled workflows
# after 60 days without repository activity, a maintainer can disable one, and
# cron delivery is best-effort. Only successes on main count, because a branch
# run saves to that branch's cache and never refreshes main's database. The
# decision logic is in scripts/check_daily_run_heartbeat.py.
#
# The threshold is 30h because GitHub starts the daily cron 3-8h late, so gaps
# between healthy runs already reach 27h. Runs roughly every 4h; GitHub may
# delay or skip scheduled runs.
#
# Blind spot: this workflow is scheduled too, so the 60-day rule disables it
# at the same moment as daily-run.yml. Catching that needs a prober outside
# GitHub.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The issue dedup below is list-then-create, so overlapping runs could file
# duplicates. Queue rather than cancel.
concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Check the daily run is still alive
    runs-on: ubuntu-latest

    # A hung job would hold the queue and silence the check. It takes seconds.
    timeout-minutes: 5

    # actions: read for workflow state and run results; issues: write to file
    # the breach issue. Nothing else.
    permissions:
      contents: read
      actions: read
      issues: write

    env:
      THRESHOLD_HOURS: "30"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          # No pip cache: the script uses only the standard library.

      # Exit 1 = breach or check error; the next step files the issue.
      - name: Check daily-run heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_daily_run_heartbeat.py \
            --repo "$GITHUB_REPOSITORY" \
            --workflow daily-run.yml \
            --branch main \
            --threshold-hours "$THRESHOLD_HOURS" \
            --report heartbeat_report.md

      - name: File or update heartbeat breach issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |

          {
            echo "## Daily run heartbeat failed — $(date -u +%F)"
            echo ""
            echo "Heartbeat run: $RUN_URL"
            echo ""
            if [ -f heartbeat_report.md ]; then
              cat heartbeat_report.md
            else
              echo "The heartbeat check itself failed before reaching a verdict"
              echo "(Actions API unreachable, or the check errored) — see the run"
              echo "log above. Liveness of the daily run is UNKNOWN, not proven."
            fi
          } > heartbeat_body.md

          # Shares the daily-run-breach label (declared in terraform/github)
          # so a pipeline that fails and then goes silent gives one thread.
          existing=$(gh issue list --label daily-run-breach --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file heartbeat_body.md
          else
            gh issue create \
              --title "Daily run heartbeat: no successful run in ${THRESHOLD_HOURS}h ($(date -u +%F))" \
              --label daily-run-breach \
              --body-file heartbeat_body.md
          fi
