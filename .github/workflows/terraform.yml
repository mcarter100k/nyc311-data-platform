name: Terraform

# fmt and validate for both root modules, with no credentials. No paths:
# filter, so it can be made a required check without blocking unrelated PRs.
# It is not required today (see terraform/github/main.tf).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format check and validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    # terraform init reaches the provider registry and could hang.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The Snowflake foundation (never applied) and the repository config
        # (applied).
        dir: [terraform, terraform/github]

    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "~> 1.7"

      - name: terraform fmt check
        run: terraform fmt --check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false -no-color

      - name: terraform validate
        run: terraform validate -no-color
