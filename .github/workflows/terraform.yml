name: Terraform

# Runs on EVERY PR and on pushes to main — deliberately no `paths:` filter.
# A path-filtered workflow cannot be a required branch-protection check
# (non-matching PRs would block forever on a pending status), and the old
# PR-only + paths trigger meant direct pushes to main shipped unvalidated.
# fmt+validate completes in seconds; running it unconditionally buys a
# requirable, always-on gate.
on:
  pull_request:
  push:
    branches: [main]

# Least-privilege and superseded-run cancellation, matching dbt-docs.yml.
permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format check and validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two independent root modules: the Snowflake foundation (specified,
        # never applied — applying needs a paid account) and the GitHub repo
        # config (applied for real). Both must validate; neither needs creds to.
        dir: [terraform, terraform/github]

    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "~> 1.7"

      - name: terraform fmt check
        run: terraform fmt --check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false -no-color

      - name: terraform validate
        run: terraform validate -no-color
