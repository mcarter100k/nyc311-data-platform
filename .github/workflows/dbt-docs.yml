name: Deploy dbt Docs to GitHub Pages

# Publishes the dbt docs site on pushes to main that touch dbt/ or this file,
# or on a manual run.
on:
  push:
    branches: [main]
    paths:
      - 'dbt/**'
      - '.github/workflows/dbt-docs.yml'
  workflow_dispatch:

# Read-only by default. Only the deploy job gets pages: write, so the build
# job, which installs packages and runs dbt, never holds a publishing token.
permissions:
  contents: read

# A newer push cancels an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:
    name: Build dbt docs site
    runs-on: ubuntu-latest
    # A hang would hold the `pages` group; normal runs take under a minute.
    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dbt-core and dbt-snowflake
        run: pip install -r dbt/requirements.txt

      - name: Install dbt packages (dbt deps)
        working-directory: dbt
        run: |
          dbt deps \
            --profiles-dir ci-profile \
            --project-dir .

      # dbt parse, not compile: every command that resolves SQL opens a
      # Snowflake connection, and CI has no credentials. The site is
      # manifest.json + a stub catalog.json + dbt's bundled index.html, so the
      # Compiled tab is empty and column statistics are missing.
      - name: Parse dbt project (generates manifest.json, no DB connection)
        working-directory: dbt
        run: |
          dbt parse \
            --profiles-dir ci-profile \
            --project-dir . \
            --target ci \
            --no-version-check

      - name: Assemble dbt docs site
        working-directory: dbt
        run: |
          python3 << 'PYEOF'
          import datetime, glob, json, os, shutil, sys

          target_dir = "target"
          os.makedirs(target_dir, exist_ok=True)

          # ── 1. Verify manifest.json from the parse step ───────────────────────
          manifest_path = os.path.join(target_dir, "manifest.json")
          if not os.path.exists(manifest_path):
              print("ERROR: target/manifest.json not found — did dbt parse succeed?",
                    file=sys.stderr)
              sys.exit(1)
          with open(manifest_path) as fh:
              manifest = json.load(fh)
          node_count = len(manifest.get("nodes", {}))
          source_count = len(manifest.get("sources", {}))
          print(f"manifest.json: {node_count} nodes, {source_count} sources")

          # ── 2. Write stub catalog.json ─────────────────────────────────────────
          # A real catalog queries the warehouse. Empty nodes/sources is valid;
          # the UI shows N/A for column statistics.
          catalog = {
              "metadata": {
                  "dbt_schema_version":
                      "https://schemas.getdbt.com/dbt/catalog/v1/updated.json",
                  "dbt_version": manifest["metadata"]["dbt_version"],
                  "generated_at": datetime.datetime.now(datetime.timezone.utc).strftime(
                      "%Y-%m-%dT%H:%M:%S.%fZ"
                  ),
                  "errors": None,
              },
              "nodes": {},
              "sources": {},
          }
          catalog_path = os.path.join(target_dir, "catalog.json")
          with open(catalog_path, "w") as fh:
              json.dump(catalog, fh, indent=2)
          print(f"catalog.json: wrote stub ({os.path.getsize(catalog_path):,} bytes)")

          # ── 3. Copy the bundled index.html from the dbt-core package ───────────
          # What `dbt docs generate` would copy. dbt-core ships it at
          # dbt/task/docs/index.html; the glob survives a move within the
          # package, and finding nothing fails the job.
          import dbt
          dbt_pkg_dir = os.path.dirname(dbt.__file__)

          candidates = sorted(
              glob.glob(
                  os.path.join(dbt_pkg_dir, "**", "index.html"),
                  recursive=True,
              )
          )
          if not candidates:
              print(
                  f"ERROR: Could not find bundled index.html under {dbt_pkg_dir}.\n"
                  f"Contents of {dbt_pkg_dir}:",
                  file=sys.stderr,
              )
              for entry in os.listdir(dbt_pkg_dir):
                  print(f"  {entry}", file=sys.stderr)
              sys.exit(1)

          index_src = candidates[0]
          index_dst = os.path.join(target_dir, "index.html")
          shutil.copy(index_src, index_dst)
          print(f"index.html: copied from {index_src} ({os.path.getsize(index_dst):,} bytes)")

          # ── 4. Verify the complete artifact set ────────────────────────────────
          print("\nArtifact summary:")
          required = ["manifest.json", "catalog.json", "index.html"]
          all_ok = True
          for fname in required:
              path  = os.path.join(target_dir, fname)
              size  = os.path.getsize(path) if os.path.exists(path) else -1
              ok    = size > 0
              mark  = "✓" if ok else "✗"
              print(f"  {mark}  target/{fname}  ({size:,} bytes)")
              if not ok:
                  all_ok = False

          if not all_ok:
              print("\nERROR: One or more required artifacts are missing.", file=sys.stderr)
              sys.exit(1)

          print("\nDocs site ready for GitHub Pages deployment.")
          PYEOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dbt/target

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Publish from main only; a manual run from a branch builds but does not
    # deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The Pages API can queue a deployment, so allow some minutes.
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write     # publish to GitHub Pages
      id-token: write  # OIDC auth with the Pages API

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Print published URL
        run: |
          echo "### dbt Docs Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The lineage graph, model descriptions, and test coverage are live." >> $GITHUB_STEP_SUMMARY
          echo "Column-level statistics (row counts, data types) are omitted in CI docs" >> $GITHUB_STEP_SUMMARY
          echo "because catalog generation requires a live Snowflake connection." >> $GITHUB_STEP_SUMMARY
          echo "Run \`dbt docs generate\` locally with real credentials to include them." >> $GITHUB_STEP_SUMMARY
