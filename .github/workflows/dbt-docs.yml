name: Deploy dbt Docs to GitHub Pages

# Triggers on every push to main that touches dbt models, macros, or this
# workflow file. The workflow_dispatch trigger allows a manual run from the
# GitHub Actions UI without a code push (useful after enabling Pages for the
# first time or after changing the profiles.yml mock).
on:
  push:
    branches: [main]
    paths:
      - 'dbt/**'
      - '.github/workflows/dbt-docs.yml'
  workflow_dispatch:

# ── Permissions ───────────────────────────────────────────────────────────────
# Workflow default is read-only; the deploy job elevates itself to
# pages: write + id-token: write at the JOB level, so the build job (which
# runs pip install and dbt parse on the checked-out ref) never holds a
# token that can publish.
permissions:
  contents: read

# Prevent concurrent Pages deployments. If a second push arrives while a
# deploy is in progress, cancel the in-progress run rather than queueing.
concurrency:
  group: pages
  cancel-in-progress: true

# ── Jobs ──────────────────────────────────────────────────────────────────────
# Two-job structure (build + deploy) matches the GitHub Pages deployment model:
# the artifact upload must complete before the Pages deployment can start, and
# the deploy job has its own environment context (github-pages) for audit trails.

jobs:

  # ── build ──────────────────────────────────────────────────────────────────
  build:
    name: Build dbt docs site
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          # Cache pip dependencies keyed on requirements to speed up re-runs.
          cache: pip

      # Install the exact versions pinned in dbt/requirements.txt so CI, docs,
      # and local environments all run identical dbt versions. The supported
      # range is declared once, in dbt_project.yml's require-dbt-version.
      - name: Install dbt-core and dbt-snowflake
        run: pip install -r dbt/requirements.txt

      # ── IMPORTANT: why this uses `dbt parse`, not `dbt compile` ─────────────
      # Every dbt command that resolves SQL opens a warehouse connection —
      # including `dbt compile` and `dbt docs generate --no-compile`. With the
      # placeholder profile below that fails:
      #     Database Error 290404 (08001): 404 Not Found:
      #     post placeholder.us-east-1.snowflakecomputing.com/session/v1/login-request
      # This workflow used `dbt compile` and had therefore failed on EVERY run
      # since the workflow was added; ci.yml already used `dbt parse` for the
      # same reason but the fix was never carried across.
      #
      # `dbt parse` validates the whole project, resolves ref()/source() and
      # macros, and writes manifest.json with zero network calls. The CI docs
      # site is therefore assembled from three pieces:
      #
      #   1. `dbt parse`     — manifest.json: full DAG, node metadata, model
      #                        and column descriptions, declared tests, and the
      #                        raw (pre-Jinja-render) model SQL.
      #   2. Stub catalog.json — structurally valid, accepted by the docs UI;
      #                        omits warehouse column statistics.
      #   3. Copy index.html — the static asset `dbt docs generate` would copy
      #                        from the installed dbt-core package.
      #
      # Accepted trade-off, consistent with the stub catalog: the docs site
      # shows lineage, descriptions, tests and raw model SQL, but the
      # "Compiled" tab is empty because compiled_code is only populated by a
      # command that connects. Restoring it requires real credentials.

      # Write a CI-only profiles.yml into the dbt/ directory.
      # The Snowflake credentials here are intentionally dummy values — they
      # satisfy the dbt profile schema validator. `dbt parse` never opens a
      # connection, so they are never exercised — but note they ARE exercised
      # (and fail) by any command that resolves SQL, which is why this
      # workflow parses rather than compiles.
      #
      # This file is written at CI runtime and is never committed to the repo
      # (profiles.yml is in .gitignore; dbt/profiles.yml.example documents
      # the real structure for local development).
      - name: Write mock CI profiles.yml
        run: |
          cat > dbt/profiles.yml << 'EOF'
          nyc311:
            target: ci
            outputs:
              ci:
                type: snowflake
                # Placeholder values — `dbt parse` validates the profile
                # schema without connecting. Replace with real credentials
                # (via GitHub Secrets) only if compiled SQL or live catalog
                # generation is required.
                account: "placeholder.us-east-1"
                user: ci_user
                password: ci_password
                role: NYC311_TRANSFORMER
                database: NYC311_DB
                warehouse: NYC311_WH
                schema: gold
                threads: 1
                client_session_keep_alive: false
          EOF

      - name: Install dbt packages (dbt deps)
        working-directory: dbt
        run: |
          dbt deps \
            --profiles-dir . \
            --project-dir .

      # dbt parse resolves the full model DAG (ref(), source(), macros, Jinja)
      # and writes manifest.json to target/ with no warehouse connection.
      # Snowflake-specific SQL (DATEDIFF, TIMESTAMP_NTZ, ZORDER) is treated as
      # opaque text — parse validates project and template structure, not the
      # SQL dialect. Dialect errors surface only against a real warehouse.
      - name: Parse dbt project (generates manifest.json, no DB connection)
        working-directory: dbt
        run: |
          dbt parse \
            --profiles-dir . \
            --project-dir . \
            --target ci \
            --no-version-check

      # Assemble the three files that make up the dbt docs static site:
      #   manifest.json  — already in target/ from the parse step above
      #   catalog.json   — stub (no warehouse column stats; full lineage preserved)
      #   index.html     — copied from the dbt-core package's bundled static asset
      - name: Assemble dbt docs site
        working-directory: dbt
        run: |
          python3 << 'PYEOF'
          import datetime, glob, json, os, shutil, sys

          target_dir = "target"
          os.makedirs(target_dir, exist_ok=True)

          # ── 1. Verify manifest.json from compile step ─────────────────────────
          manifest_path = os.path.join(target_dir, "manifest.json")
          if not os.path.exists(manifest_path):
              print("ERROR: target/manifest.json not found — did dbt parse succeed?",
                    file=sys.stderr)
              sys.exit(1)
          with open(manifest_path) as fh:
              manifest = json.load(fh)
          node_count = len(manifest.get("nodes", {}))
          source_count = len(manifest.get("sources", {}))
          print(f"manifest.json: {node_count} nodes, {source_count} sources")

          # ── 2. Write stub catalog.json ─────────────────────────────────────────
          # Full catalog generation queries the warehouse's information_schema
          # (column names, data types, row counts). An empty nodes/sources dict
          # is a valid catalog — the dbt docs UI renders the lineage graph,
          # model descriptions, and test coverage from manifest.json; it
          # displays 'N/A' for column statistics when catalog entries are absent.
          catalog = {
              "metadata": {
                  "dbt_schema_version":
                      "https://schemas.getdbt.com/dbt/catalog/v1/updated.json",
                  "dbt_version": manifest.get("metadata", {}).get("dbt_version", "1.7.0"),
                  "generated_at": datetime.datetime.utcnow().strftime(
                      "%Y-%m-%dT%H:%M:%S.%fZ"
                  ),
                  "errors": None,
              },
              "nodes": {},
              "sources": {},
          }
          catalog_path = os.path.join(target_dir, "catalog.json")
          with open(catalog_path, "w") as fh:
              json.dump(catalog, fh, indent=2)
          print(f"catalog.json: wrote stub ({os.path.getsize(catalog_path):,} bytes)")

          # ── 3. Copy the bundled index.html from the dbt-core package ───────────
          # `dbt docs generate` copies this file from the installed dbt-core package
          # to target/index.html. We replicate that step without the DB connection.
          import dbt
          dbt_pkg_dir = os.path.dirname(dbt.__file__)

          # Search recursively under the dbt package directory. In dbt-core 1.x the
          # file lives at dbt/include/index.html; the glob handles minor variations
          # across patch versions without hard-coding the exact path.
          candidates = sorted(
              glob.glob(
                  os.path.join(dbt_pkg_dir, "**", "index.html"),
                  recursive=True,
              )
          )
          if not candidates:
              print(
                  f"ERROR: Could not find bundled index.html under {dbt_pkg_dir}.\n"
                  f"Contents of {dbt_pkg_dir}:",
                  file=sys.stderr,
              )
              for entry in os.listdir(dbt_pkg_dir):
                  print(f"  {entry}", file=sys.stderr)
              sys.exit(1)

          index_src = candidates[0]
          index_dst = os.path.join(target_dir, "index.html")
          shutil.copy(index_src, index_dst)
          print(f"index.html: copied from {index_src} ({os.path.getsize(index_dst):,} bytes)")

          # ── 4. Verify the complete artifact set ────────────────────────────────
          print("\nArtifact summary:")
          required = ["manifest.json", "catalog.json", "index.html"]
          all_ok = True
          for fname in required:
              path  = os.path.join(target_dir, fname)
              size  = os.path.getsize(path) if os.path.exists(path) else -1
              ok    = size > 0
              mark  = "✓" if ok else "✗"
              print(f"  {mark}  target/{fname}  ({size:,} bytes)")
              if not ok:
                  all_ok = False

          if not all_ok:
              print("\nERROR: One or more required artifacts are missing.", file=sys.stderr)
              sys.exit(1)

          print("\nDocs site ready for GitHub Pages deployment.")
          PYEOF

      # Configure the Pages upload context. Must run before upload-pages-artifact.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Upload dbt/target/ as the Pages artifact. The deploy job picks this up.
      # The artifact name is always 'github-pages' (fixed by the Pages API).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Path is relative to the repository root.
          path: dbt/target

  # ── deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Publish from main only. workflow_dispatch has no branch guard of its
    # own, so without this condition ANY branch containing this file could be
    # dispatched straight onto the production docs site — unreviewed and
    # without passing CI. Dispatching from a branch still runs the build job
    # as a dry-run; only the publish is gated.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write     # publish to GitHub Pages
      id-token: write  # OIDC auth with the Pages API

    # The github-pages environment records every deployment in the repository's
    # Environments tab and provides the published URL as a deployment status.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      # Print the published URL to the Actions summary for quick access.
      - name: Print published URL
        run: |
          echo "### dbt Docs Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The lineage graph, model descriptions, and test coverage are live." >> $GITHUB_STEP_SUMMARY
          echo "Column-level statistics (row counts, data types) are omitted in CI docs" >> $GITHUB_STEP_SUMMARY
          echo "because catalog generation requires a live Snowflake connection." >> $GITHUB_STEP_SUMMARY
          echo "Run \`dbt docs generate\` locally with real credentials to include them." >> $GITHUB_STEP_SUMMARY
