# Weekly dependency updates. Minor and patch releases arrive grouped (one PR
# per ecosystem); majors arrive one per PR so a breaking bump is never buried.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # One entry for every requirements file, so a package pinned in two files
  # (dbt-core in dbt/ and local/, pandas in local/ and tests/unit/, pytest in
  # / and tests/unit/) moves in both within a single PR. Separate entries
  # produce one PR per file, and each fails CI alone because front-door
  # installs the files together.
  - package-ecosystem: pip
    directories:
      - /
      - /dbt
      - /local
      - /tests/unit
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
