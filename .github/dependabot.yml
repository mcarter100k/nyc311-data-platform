# Weekly dependency updates. Minor and patch releases arrive grouped (one PR
# per ecosystem); majors arrive one per PR so a breaking bump is never buried.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # One entry for every requirements file, so a minor or patch bump to a
  # package pinned in two files (dbt-core in dbt/ and local/, pandas in local/
  # and tests/unit/, pytest in / and tests/unit/) lands in both in one grouped
  # PR. With one entry per file, a dbt-core bump arrives as two PRs and each
  # fails front-door, which installs dbt/ and local/ together. Major bumps are
  # not grouped and can still arrive as one PR per file; merge those together.
  - package-ecosystem: pip
    directories:
      - /
      - /dbt
      - /local
      - /tests/unit
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
