# Placeholder Snowflake profile for CI, dbt-docs.yml and ./run_tests.sh. No
# value here is a real credential.
#
# Committed because every consumer needs a profile that passes dbt's schema
# check; dbt/profiles.yml holds real credentials and stays gitignored. Passed as
# `--profiles-dir ci-profile` so running tests never overwrites a developer's
# own profile. Only commands that never connect work with it (`dbt deps`,
# `dbt parse`, `dbt docs generate --no-compile`), which is why every consumer
# parses rather than compiles.

nyc311:
  target: ci
  outputs:
    ci:
      type: snowflake
      account: "placeholder.us-east-1"
      user: ci_user
      password: ci_password
      role: NYC311_TRANSFORMER
      database: NYC311_DB
      warehouse: NYC311_WH
      schema: gold
      threads: 1
      client_session_keep_alive: false
