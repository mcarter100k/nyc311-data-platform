version: 2

models:
  - name: stg_data_quality_log
    description: >
      Thin staging view over the Silver data_quality_log source table, which is
      written by the Silver transform before the Silver write (one row per quality check
      per pipeline run date). A pure passthrough — no renames or casts are needed —
      that exists so fct_data_quality, its only consumer, reads through the staging
      layer instead of referencing the source directly, keeping source isolation
      uniform across the project.
    tests:
      # Grain guarantee: duplicate (run_date, check_name) rows would silently
      # corrupt the rolling averages and breach flags in fct_data_quality.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - run_date
            - check_name
    columns:
      - name: run_date
        description: >
          Pipeline run date (YYYY-MM-DD string matching the Silver widget value).
          Together with check_name this forms the grain of the log.
        tests:
          - not_null

      - name: check_name
        description: >
          Identifier for the quality check (e.g. null_rate_unique_key,
          duplicate_rate, invalid_resolution_days). fct_data_quality partitions
          its 7-day rolling averages by this column.
        tests:
          - not_null

      - name: records_checked
        description: "Number of records in scope for this check on this run date."

      - name: records_failed
        description: "Number of records that failed this check on this run date."

      - name: failure_rate
        description: >
          records_failed / records_checked, range 0.0–1.0. The raw input to the
          rolling-average and threshold-breach logic in fct_data_quality.

      - name: pipeline_stage
        description: "Pipeline layer that produced the check. Always 'silver' for rows written by the Silver transform."
