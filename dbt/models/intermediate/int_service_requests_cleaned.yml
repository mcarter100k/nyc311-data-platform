version: 2

models:
  - name: int_service_requests_cleaned
    description: >
      Cleaned and enriched service requests. Standardizes borough, computes
      resolution_days, classifies complaint_category, derives closure_type, and
      drops rows where closed_date precedes created_date. All business rules
      for the marts live here.
    columns:

      # Uniqueness is tested in stg_service_requests and fct_service_requests;
      # this model neither joins nor unions, so it cannot add duplicates.
      - name: service_request_id
        description: "MD5 surrogate key inherited from staging. Unique per service request."
        tests:
          - not_null

      - name: unique_key
        description: "Natural key from NYC Open Data."
        tests:
          - not_null

      - name: borough_clean
        description: >
          Standardized borough name. All raw variants (BK, Bklyn, KINGS, etc.)
          are mapped to one of five canonical values. Unrecognized values become
          UNSPECIFIED. This column is the join key for dim_location.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'BROOKLYN'
                  - 'MANHATTAN'
                  - 'QUEENS'
                  - 'BRONX'
                  - 'STATEN ISLAND'
                  - 'UNSPECIFIED'

      - name: complaint_category
        description: >
          Grouped complaint category derived from complaint_type via CASE WHEN
          pattern matching (21 operational categories). Categories follow how
          the city is organised, so each maps to an accountable agency.

          'Unspecified' means the source supplied no complaint_type.
          'Undecodable' means it supplied one and no rule matched (e.g. Green
          Infrastructure, E-Scooter, LinkNYC): a decoder miss, not a verdict.
          assert_complaint_classification_coverage holds 'Undecodable' under 5%
          of rows.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Noise'
                  - 'Heat & Hot Water'
                  - 'Animals'
                  - 'Rodent'
                  - 'Abandoned Vehicle'
                  - 'Taxi & For-Hire Vehicle'
                  - 'Illegal Parking'
                  - 'Street Light'
                  - 'Traffic & Signals'
                  - 'Sanitation'
                  - 'Illegal Dumping'
                  - 'Parks & Trees'
                  - 'Street Condition'
                  - 'Graffiti'
                  - 'Homeless Services'
                  - 'Environmental Hazard'
                  - 'Construction & Building Code'
                  - 'Water & Sewer'
                  - 'Housing & Building Maintenance'
                  - 'Public Safety & Quality of Life'
                  - 'Consumer & Business'
                  - 'Unspecified'
                  - 'Undecodable'

      - name: closure_type
        description: >
          How the request was closed, decoded from the templated
          resolution_description text. 'Closed' status alone does not mean the
          problem was fixed; most closed requests describe no action. Action
          outcomes are Resolved on Scene, Enforcement Action and Work Performed.

          'Unspecified' means the source stated no resolution (null, blank or
          'N/A'). 'Undecodable' means it stated one and no rule matched; those
          rows count as is_actioned = FALSE even when the text describes work,
          so read fct_daily_volume.undecodable_closure_requests beside any
          action rate.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Resolved on Scene'
                  - 'Enforcement Action'
                  - 'Work Performed'
                  - 'No Violation Found'
                  - 'No Condition Found'
                  - 'Access Failed'
                  - 'Duplicate'
                  - 'Referred Elsewhere'
                  - 'Pending'
                  - 'Unspecified'
                  - 'Undecodable'

      - name: resolution_days
        description: >
          Calendar days (midnights crossed) between created_date and
          closed_date. NULL for open requests. Never negative: this model drops
          rows closed before they opened.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "resolution_days is not null"

      - name: created_date
        description: "Timestamp when the service request was submitted. Never null."
        tests:
          - not_null

      - name: agency_abbreviation
        description: "Short agency code. UNKNOWN sentinel applied by Silver for null/empty values."
        tests:
          - not_null
