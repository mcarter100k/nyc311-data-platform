version: 2

models:
  - name: int_load_completeness
    description: >
      One row per calendar day in the loaded source window, with the verdict
      "has the source published this day in full?". The single definition of a
      complete day: fct_complaint_recurrence takes its observation horizon as
      MAX(load_day) WHERE is_complete_day, and fct_daily_volume joins the flag
      onto each day.

      A day is complete when its newest request lands within
      complete_day_tail_minutes of midnight. Row counts are not used because a
      lagging source replica serves fewer rows for days younger than 7 (ADR
      016), which would bias a count threshold low on the youngest days.

      A day absent from this table is outside the loaded window, not
      incomplete.
    columns:
      - name: load_day
        description: "Calendar date of creation. Grain of this table."
        tests:
          - unique
          - not_null

      - name: requests_created
        description: >
          Requests created on this day that are present in the load. Context
          only; not part of the completeness rule.
        tests:
          - not_null

      - name: last_created_at
        description: "Newest created_date on this day. The measurement the verdict rests on."
        tests:
          - not_null

      - name: requests_in_tail_window
        description: >
          Requests created within complete_day_tail_minutes of midnight. The
          audit margin behind is_complete_day (0 on a partial day).
        tests:
          - not_null

      - name: minutes_short_of_midnight
        description: >
          Minutes between last_created_at and the end of the day. About 1 on a
          complete day; hundreds on the trailing partial day.
        tests:
          - not_null

      - name: is_complete_day
        description: >
          TRUE when minutes_short_of_midnight <= complete_day_tail_minutes.
          Consumers take MAX(load_day) WHERE is_complete_day as the end of
          trustworthy history.
        tests:
          - not_null
