name: 'nyc311'
version: '1.0.0'
config-version: 2

profile: 'nyc311'

model-paths:    ["models"]
test-paths:     ["tests"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

target-path:   "target"
clean-targets: ["target", "dbt_packages"]

models:
  nyc311:
    staging:
      +materialized: view
      +tags: ["staging"]
      # No +schema: staging views land in target.schema (GOLD).
      # To route staging to a dedicated STAGING schema, provision it in
      # terraform/modules/snowflake-foundation/main.tf with TRANSFORMER grants,
      # then re-add +schema: staging here.

    intermediate:
      +materialized: view
      # No +schema: intermediate views land in target.schema (GOLD).

    marts:
      +materialized: table
      +schema: gold
      +tags: ["gold"]
      # generate_schema_name macro (macros/generate_schema_name.sql) returns
      # 'gold' as-is. Without the macro, this would produce 'gold_gold'.

# Project-level variable defaults.
# Override at runtime:  dbt run --vars '{"min_date": "2020-01-01"}'
# Override in CI:       dbt run --vars '{"max_date": "{{ run_started_at.strftime(\"%%Y-%%m-%%d\") }}"}'
vars:
  min_date: '2010-01-01'
  max_date: '2030-12-31'

  # Schema version stamp written into stg_service_requests as a literal column.
  # Downstream Gold models carry this value so historical rows can be traced to
  # the schema contract that produced them.
  #
  # Increment this integer whenever a BREAKING schema change reaches Gold —
  # meaning a column is removed, renamed, or its type changes incompatibly.
  # Additive changes (new Bronze columns flowing through Silver) do NOT require
  # a version bump because they are invisible to existing Gold consumers until
  # someone explicitly adds them to a mart .sql file.
  #
  # The version is an integer string so it sorts correctly in Snowflake VARCHAR
  # comparisons and remains legible without a lookup table.
  # See ADR 006 for the full schema evolution contract.
  schema_version: '1'
