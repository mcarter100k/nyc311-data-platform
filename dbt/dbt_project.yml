name: 'nyc311'
version: '1.0.0'
config-version: 2

profile: 'nyc311'

# Exact versions are pinned in requirements.txt; this is the supported range.
require-dbt-version: [">=1.7.0", "<2.0.0"]

model-paths:    ["models"]
test-paths:     ["tests"]
macro-paths:    ["macros"]
# The borough mapping lives in repo-root config/ because the pandas Silver
# transform reads the same file.
seed-paths:     ["../config"]
snapshot-paths: ["snapshots"]

target-path:   "target"
clean-targets: ["target", "dbt_packages"]

models:
  nyc311:
    staging:
      +materialized: view
      +tags: ["staging"]

    intermediate:
      # A table, not a view: several models read int_service_requests_cleaned,
      # and its ILIKE classification should run once per build, not once per reader.
      +materialized: table

    marts:
      +materialized: table
      +schema: gold
      +tags: ["gold"]

# Every model lands in the target schema (GOLD); see macros/generate_schema_name.sql.

vars:
  min_date: '2010-01-01'
  max_date: '2030-12-31'

  # Bump on a breaking Gold change (column removed, renamed or retyped).
  # Stored per row in fct_service_requests. See ADR 006.
  schema_version: '1'

  # fct_complaint_recurrence only looks this far ahead for a repeat complaint.
  # The bound keeps the self-join on a busy address from growing quadratically.
  recurrence_max_window_days: 30

  # An (address, complaint_type) pair with at least this many tickets is a
  # chronic location: it recurs by nature, not because a fix failed.
  chronic_location_min_tickets: 5

  # 30 = NYC's closure standard. fct_daily_volume counts "closed within this
  # many days of creation" (fct_service_requests.is_overdue hard-codes the
  # same 30; see its comment). A day's rates publish only once this many complete days follow it.
  # The daily fetch re-pulls 37 days so Gold sees every closure up to day 30
  # after the source settles (ADR 016); a shorter fetch window makes these
  # rates read low.
  closure_window_days: 30

  # int_load_completeness: a day is complete when its newest request is within
  # this many minutes of midnight. Complete days end ~1 minute short and the
  # partial day hundreds of minutes short, so any value from ~5 to ~600 gives
  # the same verdicts (measured in ADR 016).
  complete_day_tail_minutes: 60
