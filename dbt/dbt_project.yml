name: 'nyc311'
version: '1.0.0'
config-version: 2

profile: 'nyc311'

# Environments pin exact versions in dbt/requirements.txt (single source of
# truth for installs); this range declares what the project itself supports.
require-dbt-version: [">=1.7.0", "<2.0.0"]

model-paths:    ["models"]
test-paths:     ["tests"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

target-path:   "target"
clean-targets: ["target", "dbt_packages"]

models:
  nyc311:
    staging:
      +materialized: view
      +tags: ["staging"]
      # No +schema: staging views land in target.schema (GOLD).
      # To route staging to a dedicated STAGING schema, provision it in
      # terraform/modules/snowflake-foundation/main.tf with TRANSFORMER grants,
      # then re-add +schema: staging here.

    intermediate:
      +materialized: table
      # Table, not view: int_service_requests_cleaned is read by three models
      # (dim_location, agency_snapshot, fct_service_requests). As a view, its
      # 12-branch leading-wildcard ILIKE classification would re-execute over
      # full history three times per run; materializing it computes that once.
      # No +schema: the intermediate table lands in target.schema (GOLD).

    marts:
      +materialized: table
      +schema: gold
      +tags: ["gold"]
      # generate_schema_name macro (macros/generate_schema_name.sql) returns
      # 'gold' as-is. Without the macro, this would produce 'gold_gold'.

# Project-level variable defaults.
# Override at runtime:  dbt run --vars '{"min_date": "2020-01-01"}'
# Override in CI:       dbt run --vars '{"max_date": "{{ run_started_at.strftime(\"%%Y-%%m-%%d\") }}"}'
vars:
  min_date: '2010-01-01'
  max_date: '2030-12-31'

  # Schema version stamp selected in stg_service_requests as a literal column.
  # Staging is a view, so the value there is evaluated at query time; it becomes
  # durable in fct_service_requests, whose incremental merge writes it into each
  # physical row. Rows untouched by later merges keep the version they were
  # built under, so history can be traced to the schema contract that produced
  # it. (A --full-refresh restamps all history with the current version.)
  #
  # Increment this integer whenever a BREAKING schema change reaches Gold —
  # meaning a column is removed, renamed, or its type changes incompatibly.
  # Additive changes (new Bronze columns flowing through Silver) do NOT require
  # a version bump because they are invisible to existing Gold consumers until
  # someone explicitly adds them to a mart .sql file.
  #
  # The version is an integer string so it sorts correctly in Snowflake VARCHAR
  # comparisons and remains legible without a lookup table.
  # See ADR 006 for the full schema evolution contract.
  schema_version: '1'
